<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeckCare</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5faf6;margin:0;color:#183b20}.wrap{max-width:650px;margin:auto;padding:20px}.card{background:white;border-radius:20px;padding:22px;box-shadow:0 4px 18px #0001}h1{color:#b71c1c}label{display:block;font-weight:700;margin:15px 0 6px}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:12px;background:#b71c1c;color:white;font-size:17px;font-weight:700}.result{margin-top:18px;padding:18px;border-radius:15px;text-align:center}.green{background:#dff3df}.yellow{background:#fff3bf}.orange{background:#ffe1c7}.red{background:#ffdada}.white{background:#f0f0f0}.hidden{display:none}.exercise{padding:15px;border:1px solid #ddd;border-radius:14px;margin-top:12px}.timer{text-align:center;font-size:45px;font-weight:800;margin:10px}.back{background:#777}</style></head><body><div class="wrap"><div class="card"><h1>🌿 NeckCare</h1><p>เว็บแอปส่งเสริมการผ่อนคลายอาการปวดคอจากพฤติกรรมก้มใช้โทรศัพท์มือถือ</p><label>ชื่อ</label><input id="name" placeholder="กรอกชื่อ"><label>เลขที่</label><input id="no" placeholder="กรอกเลขที่"><label>คะแนนจากแบบประเมิน (0–25)</label><input id="score" type="number" min="0" max="25" placeholder="เช่น 12"><button id="evaluate">ประเมินระดับอาการ</button><div id="result" class="hidden"></div><div id="program" class="hidden"></div></div></div><script>const data=[{a:0,b:5,p:'0',c:'white',t:'ระดับ 0',e:['หายใจและผ่อนคลายไหล่','หมุนไหล่เบา ๆ','จัดท่านั่งและเก็บคาง']},{a:6,b:10,p:'1–3',c:'green',t:'ระดับ 1–3',e:['หมุนไหล่','เอียงคอเบา ๆ','Chin tuck']},{a:11,b:15,p:'4–6',c:'yellow',t:'ระดับ 4–6',e:['Chin tuck','ยืดคอด้านข้าง','ยืดหน้าอก']},{a:16,b:20,p:'7–9',c:'orange',t:'ระดับ 7–9',e:['จัดท่านั่ง','ผ่อนคลายไหล่','หายใจช้า ๆ']},{a:21,b:25,p:'10',c:'red',t:'ระดับ 10',e:[]}];let chosen=null;document.getElementById('evaluate').onclick=function(){let n=document.getElementById('name').value.trim(),no=document.getElementById('no').value.trim(),s=Number(document.getElementById('score').value);if(!n||!no||!Number.isInteger(s)||s<0||s>25){alert('กรุณากรอกชื่อ เลขที่ และคะแนน 0–25 ให้ครบ');return}chosen=data.find(x=>s>=x.a&&s<=x.b);let r=document.getElementById('result');r.className='result '+chosen.c;r.innerHTML='<h2>'+chosen.t+'</h2><p>ระดับความปวด '+chosen.p+'</p><p>คะแนน '+s+'/25</p>'+(chosen.c==='red'?'<p>⚠️ ไม่ควรฝืนทำกิจกรรม ควรหยุดและขอคำแนะนำจากบุคลากรทางการแพทย์</p>':'<button id="start">เริ่มโปรแกรมผ่อนคลาย</button>');if(chosen.c!=='red')document.getElementById('start').onclick=start;};function start(){let p=document.getElementById('program');p.className='';let i=0,t=60,iv;function render(){p.innerHTML='<div class="exercise"><h3>ท่าที่ '+(i+1)+'/3</h3><p>'+chosen.e[i]+'</p><div class="timer">'+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')+'</div><button id="go">เริ่มจับเวลา</button></div>';document.getElementById('go').onclick=function(){clearInterval(iv);iv=setInterval(()=>{t--;p.querySelector('.timer').textContent='00:'+String(t).padStart(2,'0');if(t<=0){clearInterval(iv);if(i<2){i++;t=60;render()}else{p.innerHTML='<h2>🎉 ปฏิบัติกิจกรรมเสร็จสิ้น</h2><p>ทำกิจกรรมครบ 3 ท่าแล้ว</p>'}}},1000)}}render()}</script></body></html>
