<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2e7d32"><title>NeckCare</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f8f4;color:#17351d}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 5px 20px #0001}h1{margin:0 0 8px;font-size:30px}.muted{color:#64736a}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:14px;border:1px solid #ccd8cf;border-radius:12px;font-size:17px}button{width:100%;padding:14px;border:0;border-radius:14px;background:#2e7d32;color:#fff;font-size:17px;font-weight:700;margin-top:12px}button.alt{background:#e8f1e9;color:#245b29}.hidden{display:none}.level{text-align:center;padding:20px;border-radius:18px}.white{background:#f1f1f1}.green{background:#ddf2df}.yellow{background:#fff0b3}.orange{background:#ffe0c2}.red{background:#ffd9d9}.pill{display:inline-block;padding:7px 12px;border-radius:99px;font-weight:800}.exercise{border:1px solid #dce7df;border-radius:16px;padding:15px;margin-top:12px}.timer{text-align:center;font-size:54px;font-weight:800;margin:12px}.barbg{height:10px;background:#e4ebe5;border-radius:20px;overflow:hidden}.bar{height:100%;background:#2e7d32;width:0}video{width:100%;border-radius:18px;background:#111;max-height:55vh}.warn{background:#fff3db;border-left:5px solid #ed9d00;padding:13px;border-radius:10px;margin:12px 0}.center{text-align:center}.hidden{display:none!important}</style></head><body><div class="wrap">
<section id="home" class="card"><h1>🌿 NeckCare</h1><p class="muted">เว็บแอปส่งเสริมการผ่อนคลายอาการปวดคอจากพฤติกรรมก้มใช้โทรศัพท์มือถือ</p><button onclick="show('login')">เริ่มใช้งาน</button></section>
<section id="login" class="card hidden"><h2>ข้อมูลผู้ใช้งาน</h2><label>ชื่อ</label><input id="name" placeholder="กรอกชื่อ"><label>เลขที่</label><input id="no" placeholder="กรอกเลขที่"><label>คะแนนจากแบบประเมิน (0–25)</label><input id="score" type="number" min="0" max="25" placeholder="เช่น 12"><button onclick="evaluate()">ประเมินระดับอาการ</button><button class="alt" onclick="show('home')">ย้อนกลับ</button></section>
<section id="result" class="card hidden"><h2>ผลการประเมิน</h2><div id="level" class="level"></div><div id="rec"></div><button id="go" onclick="start()">เริ่มโปรแกรมผ่อนคลาย</button><button class="alt" onclick="show('login')">แก้ไขข้อมูล</button></section>
<section id="activity" class="card hidden"><h2 id="title"></h2><div id="warning"></div><div id="camBox" class="hidden"><p><b>📷 กล้องสำหรับบันทึกกิจกรรม</b></p><video id="video" autoplay playsinline muted></video><p id="camStatus" class="center">กำลังเปิดกล้อง...</p></div><div id="ex"></div></section>
<section id="done" class="card hidden"><h2>🎉 ปฏิบัติกิจกรรมเสร็จสิ้น</h2><div id="summary"></div><button onclick="show('home')">กลับหน้าหลัก</button><button class="alt" onclick="show('login')">ทำแบบประเมินอีกครั้ง</button></section>
</div><script>
const levels=[
{min:0,max:5,pain:'0',cls:'white',title:'ระดับ 0',ex:[['หายใจและผ่อนคลายไหล่','นั่งหลังตรง สูดหายใจช้า ๆ พร้อมปล่อยไหล่ให้สบาย'],['หมุนไหล่เบา ๆ','หมุนไหล่ไปด้านหลังช้า ๆ โดยไม่ฝืน'],['จัดท่านั่งและเก็บคาง','นั่งหลังตรง มองตรง และเก็บคางเบา ๆ']]},
{min:6,max:10,pain:'1–3',cls:'green',title:'ระดับ 1–3',ex:[['หมุนไหล่','หมุนไหล่ไปด้านหลังอย่างช้า ๆ'],['เอียงคอเบา ๆ','เอียงศีรษะซ้ายและขวาอย่างนุ่มนวล ไม่กดหรือฝืน'],['Chin tuck','ดึงคางเข้าหาลำคอเบา ๆ โดยไม่ก้มศีรษะ']]},
{min:11,max:15,pain:'4–6',cls:'yellow',title:'ระดับ 4–6',ex:[['Chin tuck','ดึงคางเข้าหาลำคอเบา ๆ และกลับสู่ท่าปกติ'],['ยืดคอด้านข้าง','เอียงคอเล็กน้อยจนรู้สึกตึงพอดี ไม่ฝืน'],['ยืดหน้าอก','เปิดอกอย่างนุ่มนวลโดยไม่ฝืน']]},
{min:16,max:20,pain:'7–9',cls:'orange',title:'ระดับ 7–9',ex:[['จัดท่านั่ง','นั่งหลังตรง วางเท้าสบาย และลดการก้มคอ'],['ผ่อนคลายไหล่','ยกไหล่เบา ๆ แล้วปล่อยลงช้า ๆ'],['หายใจเพื่อผ่อนคลาย','หายใจเข้าและออกช้า ๆ พร้อมคลายกล้ามเนื้อ']]},
{min:21,max:25,pain:'10',cls:'red',title:'ระดับ 10',ex:[]}
];let user,level,i,timer,sec,stream;
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}
function evaluate(){let name=document.getElementById('name').value.trim(),no=document.getElementById('no').value.trim(),score=Number(document.getElementById('score').value);if(!name||!no||!Number.isInteger(score)||score<0||score>25)return alert('กรุณากรอกข้อมูลให้ครบ และคะแนนต้องอยู่ระหว่าง 0–25');user={name,no,score};level=levels.find(x=>score>=x.min&&score<=x.max);document.getElementById('level').className='level '+level.cls;document.getElementById('level').innerHTML='<span class="pill">'+level.title+'</span><h2>ระดับความปวด '+level.pain+'</h2><p>คะแนน '+score+'/25</p>';let rec=document.getElementById('rec');if(level.cls==='red'){rec.innerHTML='<div class="warn">⚠️ ระดับปวดสูงมาก ไม่แนะนำให้ฝืนทำท่า ควรหยุดกิจกรรมและขอคำแนะนำจากบุคลากรทางการแพทย์</div>';document.getElementById('go').classList.add('hidden')}else{rec.innerHTML='<p>ระบบจะแนะนำกิจกรรมผ่อนคลาย 3 ท่า ตามระดับของคุณ</p>';document.getElementById('go').classList.remove('hidden')}show('result')}
async function start(){i=0;document.getElementById('title').textContent='โปรแกรม '+level.title;document.getElementById('warning').innerHTML='<div class="warn">ทำช้า ๆ ไม่ฝืน หากปวดเพิ่มขึ้นให้หยุดทันที</div>';show('activity');await camera();render()}
async function camera(){let box=document.getElementById('camBox');box.classList.remove('hidden');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('กล้องต้องใช้ผ่าน HTTPS หรือ localhost');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});document.getElementById('video').srcObject=stream;document.getElementById('camStatus').textContent='เปิดกล้องแล้ว';}catch(e){document.getElementById('camStatus').textContent='เปิดกล้องไม่ได้: '+e.message}}
function render(){clearInterval(timer);sec=60;let a=level.ex[i];document.getElementById('ex').innerHTML='<div class="exercise"><small>ท่าที่ '+(i+1)+'/3</small><h3>'+a[0]+'</h3><p>'+a[1]+'</p><div class="timer" id="t">01:00</div><div class="barbg"><div id="bar" class="bar"></div></div><button id="b" onclick="run()">▶ เริ่มจับเวลา</button></div>'}
function run(){if(timer){clearInterval(timer);timer=null;document.getElementById('b').textContent='▶ ทำต่อ';return}document.getElementById('b').textContent='⏸ หยุดชั่วคราว';timer=setInterval(()=>{sec--;document.getElementById('t').textContent='00:'+String(sec).padStart(2,'0');document.getElementById('bar').style.width=((60-sec)/60*100)+'%';if(sec<=0){clearInterval(timer);timer=null;if(i<2){i++;render()}else finish()}},1000)}
function finish(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('summary').innerHTML='<p><b>ชื่อ:</b> '+safe(user.name)+'</p><p><b>เลขที่:</b> '+safe(user.no)+'</p><p><b>คะแนน:</b> '+user.score+'/25</p><p><b>ระดับความปวด:</b> '+level.pain+'</p><p><b>กิจกรรม:</b> 3/3 ท่า</p><p><b>เวลาฝึก:</b> 3 นาที (ท่าละ 1 นาที)</p><div class="warn">หากยังมีอาการปวด ควรปรับท่าทางการใช้โทรศัพท์และขอคำแนะนำจากบุคลากรทางการแพทย์เมื่อจำเป็น</div>';show('done')}
function safe(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
